# ==============================================================================
# WSL2 AGY Dual-Display System - Optimized tmux Configuration
# ==============================================================================

# Responsive terminal window sizing
setw -g window-size latest
setw -g aggressive-resize on

# Guarantee user local bin in PATH
set-environment -g PATH "$HOME/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

# Prevent scrollback jump on clear / mobile app resume (tmux 3.4+)
setw -g scroll-on-clear off

# Zero escape-time delay for snappy key injection
set -s escape-time 0

# Enable mouse and touch scroll support
set -g mouse on

# Terminal title synchronization
set -g set-titles on
set -g set-titles-string "AGY Terminal"

# Dark theme palette
set -g window-style 'bg=#2b2b2b,fg=#d2d2d2'
set -g window-active-style 'bg=#2b2b2b,fg=#d2d2d2'

# Alt + 1~5 session jump bindings
bind-key -n M-1 run-shell "$HOME/.local/bin/tm-jump 1"
bind-key -n M-2 run-shell "$HOME/.local/bin/tm-jump 2"
bind-key -n M-3 run-shell "$HOME/.local/bin/tm-jump 3"
bind-key -n M-4 run-shell "$HOME/.local/bin/tm-jump 4"
bind-key -n M-5 run-shell "$HOME/.local/bin/tm-jump 5"

# Copy mode page scrolling
bind-key -T copy-mode PPage send-keys -X -N 10 scroll-up
bind-key -T copy-mode NPage send-keys -X -N 10 scroll-down-and-cancel
bind-key -T copy-mode-vi PPage send-keys -X -N 10 scroll-up
bind-key -T copy-mode-vi NPage send-keys -X -N 10 scroll-down-and-cancel
bind-key -T copy-mode WheelDownPane select-pane \; send-keys -X -N 5 scroll-down-and-cancel
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 5 scroll-down-and-cancel
